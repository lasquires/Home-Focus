name: Build HomeFocus Windows

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build self-contained binaries
        shell: pwsh
        run: ./tools/Build-Release.ps1 -Version 1.0.4 -Owner "${{ github.repository_owner }}" -Repo "${{ github.event.repository.name }}"
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress
      - name: Build Windows installer
        shell: pwsh
        run: ./tools/Build-Installer.ps1 -Version 1.0.4
      - name: Verify graphical installation and background agent
        shell: pwsh
        run: ./tools/Test-InstalledAgent.ps1 -Version 1.0.4
      - uses: actions/upload-artifact@v4
        with:
          name: HomeFocus-Setup-Windows
          path: HomeFocus-Setup-*.exe
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: HomeFocus-Update-Package
          path: HomeFocus-Windows-*.zip
          if-no-files-found: error
      - name: Publish ready-to-run preview installer
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.4
          name: HomeFocus 1.0.4 (preview)
          prerelease: true
          files: |
            HomeFocus-Setup-1.0.4.exe
            HomeFocus-Windows-1.0.4.zip
      - name: Publish update manifest on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add update-manifest.json
          if (-not (git diff --cached --quiet)) {
            git commit -m "Update manifest for v1.0.4"
            git push origin HEAD:main
          }
