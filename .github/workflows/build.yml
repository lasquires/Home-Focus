name: Build HomeFocus Windows

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build self-contained binaries
        shell: pwsh
        run: ./tools/Build-Release.ps1 -Version 1.0.1 -Owner "${{ github.repository_owner }}" -Repo "${{ github.event.repository.name }}"
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress
      - name: Build Windows installer
        shell: pwsh
        run: ./tools/Build-Installer.ps1 -Version 1.0.1
      - uses: actions/upload-artifact@v4
        with:
          name: HomeFocus-Setup-Windows
          path: HomeFocus-Setup-*.exe
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: HomeFocus-Update-Package
          path: HomeFocus-Windows-*.zip
          if-no-files-found: error
